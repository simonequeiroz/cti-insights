spring.application.name=cti-insights

spring.config.import=optional:file:.env[.properties]
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/cti_insights}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
spring.sql.init.mode=never
spring.jackson.deserialization.accept-float-as-int=false
spring.jackson.deserialization.use-big-decimal-for-floats=true
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.tracking-modes=cookie
cti.etl.url=${ETL_URL:http://localhost:8000}
cti.etl.key=${ETL_API_KEY:}
cti.etl.connect-timeout=${ETL_CONNECT_TIMEOUT:3s}
cti.etl.read-timeout=${ETL_READ_TIMEOUT:60s}
cti.admin.nome=${ADMIN_NAME:}
cti.admin.email=${ADMIN_EMAIL:}
cti.admin.senha=${ADMIN_PASSWORD:}
spring.autoconfigure.exclude=org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
cti.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
